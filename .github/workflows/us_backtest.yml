name: 미장 백테스트 비교

on:
  workflow_dispatch: {}  # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: rsi-report
  cancel-in-progress: false

jobs:
  us-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python us_backtest.py

      - name: 결과 저장
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          git add site/data/us/bt_compare.json
          git diff --cached --quiet || git commit -m "미장 백테스트 비교 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
