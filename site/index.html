<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSI 과매도 알리미</title>
<meta name="description" content="코스피·코스닥·S&amp;P500 RSI 과매도 종목과 매수 후보를 매일 아침 정리해요">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rsi14.github.io/">
<meta property="og:title" content="RSI 과매도 알리미">
<meta property="og:description" content="오늘 시장 과매도 비율과 매수 후보 · 매일 아침 자동 갱신">
<meta property="og:image" content="https://rsi14.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 레이아웃: 결론 한 줄 → 오늘 종목 카드 → 지난 신호 추이, 한 화면 스크롤 */
  :root {
    --bg: #f3f4f6; --card: #ffffff; --ink: #16181d; --ink2: #3b404a; --muted: #6f7480; --line: #e3e5ea;
    --chip: #e9ebef; --grid: #eceef2;
    --down: #2a62d4; --up: #d23b2b; --mark: #2a62d4;
    --good: #1f8a5b; --goodbg: #e2f3ea; --mid: #a86a00; --midbg: #fbf0d9; --bad: #6f7480; --badbg: #eceef1;
    --sans: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1a1d22; --ink: #eceef2; --ink2: #c4c8d0; --muted: #8d929c; --line: #2a2e35;
    --chip: #252930; --grid: #23272d;
    --down: #6c9bf5; --up: #f27b6b; --mark: #6c9bf5;
    --good: #53c48d; --goodbg: #17322a; --mid: #e3ac4a; --midbg: #3a2d14; --bad: #9aa0aa; --badbg: #262a30;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #111317; --card: #1a1d22; --ink: #eceef2; --ink2: #c4c8d0; --muted: #8d929c; --line: #2a2e35;
    --chip: #252930; --grid: #23272d;
    --down: #6c9bf5; --up: #f27b6b; --mark: #6c9bf5;
    --good: #53c48d; --goodbg: #17322a; --mid: #e3ac4a; --midbg: #3a2d14; --bad: #9aa0aa; --badbg: #262a30;
    color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 64px; padding-inline: 16px; display: grid; gap: 18px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .neg { color: var(--down); } .pos { color: var(--up); }
  [hidden] { display: none !important; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 13px; }
  select { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }

  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; grid-template-columns: 1fr minmax(0, 340px); gap: 18px; align-items: center; }
  .hero h1 { margin: 0; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.3; letter-spacing: -0.03em; text-wrap: balance; }
  .hero h1 em { font-style: normal; color: var(--down); }
  .hero p { margin: 8px 0 0; color: var(--ink2); font-size: 14px; line-height: 1.6; }
  .hero p b { font-weight: 600; }
  .gradeSum { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .heroChart { min-width: 0; }
  .heroChart .cap { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .g-양호 { background: var(--goodbg); color: var(--good); }
  .g-보통 { background: var(--midbg); color: var(--mid); }
  .g-주의 { background: var(--badbg); color: var(--bad); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .t-동반 { background: var(--goodbg); color: var(--good); }
  .t-부분 { background: var(--midbg); color: var(--mid); }
  .t-단독 { background: var(--badbg); color: var(--up); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .st-panic { background: var(--goodbg); color: var(--good); }
  .st-warn { background: var(--midbg); color: var(--mid); }
  .st-calm { background: var(--badbg); color: var(--bad); }
  .bt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .bt div { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 11px; color: var(--muted); }
  .bt b { display: block; font-size: 15px; margin-top: 2px; }
  .bt small { display: block; font-size: 11px; }
  .bt .now { outline: 2px solid var(--line); outline-offset: -2px; }
  .guide { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: grid; gap: 10px; }
  .guide.go { border: 2px solid var(--good); }
  .guide .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .guide.go .eyebrow { color: var(--good); }
  .guide h2 { margin: 0; font-size: clamp(19px, 4vw, 24px); line-height: 1.4; letter-spacing: -0.02em; text-wrap: balance; }
  .guide h2 a { color: var(--down); text-decoration: none; border-bottom: 2px solid currentColor; }
  .guide p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--ink2); }
  .guide .how { font-size: 13px; color: var(--muted); }
  .card.pick { border: 2px solid var(--good); }
  .pick-tag { background: var(--good); color: var(--card); }
  .watch-tag { background: var(--chip); color: var(--ink2); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar .sp { flex: 1; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { font: inherit; font-size: 13px; padding: 6px 11px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--down); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .card.dim { opacity: .72; }
  .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .who { min-width: 0; }
  .who .nm { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .who .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .px { text-align: right; flex-shrink: 0; }
  .px .p { font-size: 17px; font-weight: 600; }
  .px .c { font-size: 13px; margin-top: 2px; }
  .rsiRow { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding-bottom: 10px; }
  .rsiVal { font-size: 13px; color: var(--ink2); }
  .rsiVal b { font-family: var(--mono); font-size: 15px; color: var(--down); }
  .gauge { position: relative; height: 6px; border-radius: 3px; background: var(--grid); }
  .gauge b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--down); }
  .gauge i { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px; background: var(--ink); transform: translateX(-1px); }
  .gauge span { position: absolute; top: 9px; font-size: 10px; color: var(--muted); transform: translateX(-50%); font-family: var(--mono); }
  .chartBox { min-width: 0; }
  .legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); margin-right: 4px; vertical-align: 1px; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .metrics div { background: var(--bg); border-radius: 10px; padding: 8px 9px; min-width: 0; }
  .metrics span { display: block; font-size: 11px; color: var(--muted); }
  .metrics b { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notes { display: grid; gap: 6px; font-size: 13px; color: var(--ink2); line-height: 1.5; }
  .notes .warn { color: var(--up); font-weight: 600; }
  .notes .why { color: var(--ink2); }
  .notes .lbl { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-right: 6px; }
  a.out { font-size: 13px; color: var(--down); text-decoration: none; font-weight: 500; justify-self: start; }

  .empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }

  .sec h2 { margin: 10px 0 4px; font-size: 19px; letter-spacing: -0.02em; }
  .sec > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat .v { font-size: 20px; font-weight: 600; }
  .stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat .s { font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .panel.pad { padding: 14px 14px 8px; }
  .sig { border-top: 1px solid var(--line); }
  .sig:first-child { border-top: 0; }
  .sig > button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr 100px 78px; gap: 10px; align-items: center; width: 100%; padding: 12px 16px; cursor: pointer; }
  .sig > button:focus-visible { outline: 2px solid var(--down); outline-offset: -2px; }
  .sig .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sig .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ret { text-align: right; font-weight: 600; font-size: 15px; }
  .ret small { display: block; font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--muted); }
  .detail { padding: 0 16px 14px; }
  .kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .kv div { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; font-size: 11px; color: var(--muted); }
  .kv b { display: block; font-size: 14px; color: var(--ink); margin-top: 2px; }
  .detail a.out { display: inline-block; margin-top: 10px; }
  .more { display: block; width: 100%; font: inherit; font-size: 13px; padding: 12px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--down); cursor: pointer; }
  footer { font-size: 12px; color: var(--muted); line-height: 1.7; }

  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; padding: 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .sig > button { grid-template-columns: 1fr 70px 70px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">RSI 과매도 알리미<span id="basis">코스피·코스닥 전 종목</span></div>
    <div style="display:flex;gap:8px;align-items:center"><div class="seg" id="mkSw"><button data-k="kr">국장</button><button data-k="us">미장</button><button data-k="congress" hidden>의원 매매</button></div><select id="date" aria-label="기준일"></select></div>
  </div>

  <section class="guide" id="guide" aria-live="polite"><div class="eyebrow">오늘의 가이드</div><h2>불러오는 중…</h2></section>

  <section class="hero">
    <div>
      <div id="status"></div>
      <h1 id="headline">불러오는 중…</h1>
      <p id="subline"></p>
      <div class="bt" id="btBox"></div>
    </div>
    <div class="heroChart">
      <div class="cap" id="heroCap">시장 과매도 비율 추이</div>
      <div id="heroChart"></div>
    </div>
  </section>

  <div class="bar">
    <div class="seg" id="typeSeg" role="group" aria-label="하락 유형">
      <button class="on" data-t="ALL">전체</button>
      <button data-t="동반">시장 동반</button>
      <button data-t="부분">부분 동반</button>
      <button data-t="단독">단독 하락</button>
    </div>
    <div class="seg" id="gradeSeg" role="group" aria-label="등급">
      <button class="on" data-g="ALL">전체</button>
      <button data-g="양호">양호</button>
      <button data-g="보통">보통</button>
    </div>
    <div class="seg" id="mktSeg" role="group" aria-label="시장">
      <button class="on" data-m="ALL">전체</button>
      <button data-m="KOSPI">코스피</button>
      <button data-m="KOSDAQ">코스닥</button>
    </div>
    <div class="sp"></div>
    <div class="hint">하락 유형 = RSI 20 아래로 들어온 날의 시장 과매도 비율 (25%↑ 동반 · 10~25% 부분 · 10%↓ 단독)<br>등급: 양호 = 시총 1조↑·거래대금 50억↑ · 잡주(시총 1천억↓·거래대금 10억↓·1,000원↓·관리/투자주의/정리매매 등)는 제외</div>
  </div>

  <div class="cards" id="cards"></div>

  <section class="sec">
    <h2>지난 신호, 지금은?</h2>
    <p>RSI가 20 아래로 떨어진 날 종가를 기준으로, 이후 60거래일 동안의 수익률 (최근 약 6개월 신호)</p>
    <div class="stats" id="hStats"></div>
    <div class="panel pad" style="margin-top:10px"><div id="avgChart"></div></div>
    <div class="bar" style="margin:12px 0 10px">
      <div class="seg" id="sigTypeSeg" role="group" aria-label="하락 유형">
        <button class="on" data-t="ALL">전체</button>
        <button data-t="동반">시장 동반</button>
        <button data-t="부분">부분</button>
        <button data-t="단독">단독</button>
      </div>
      <div class="seg" id="stSeg" role="group" aria-label="추적 상태">
        <button class="on" data-s="ALL">전체</button>
        <button data-s="ACTIVE">추적 중</button>
        <button data-s="DONE">60일 완료</button>
      </div>
    </div>
    <div class="panel" id="sigList"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("ko-KR");
const MK = new URLSearchParams(location.search).get("m") === "us" ? "us" : "kr", US = MK === "us";
const money = (v) => US ? "$" + Number(v).toFixed(2) : fmt(Math.round(v)) + "원";
const link0 = (c) => US ? "https://finance.yahoo.com/quote/" + c : "https://m.stock.naver.com/domestic/stock/" + c + "/total";
const pct = (v) => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const cls = (v) => (v < 0 ? "neg" : v > 0 ? "pos" : "");
const ymd = (s) => `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}`;
const eok = (v) => v == null ? "–" : v >= 10000 ? (v / 10000).toFixed(v >= 100000 ? 0 : 1) + "조" : fmt(Math.round(v)) + "억";
const ORDER = { "양호": 0, "보통": 1, "주의": 2 };
const TORDER = { "동반": 0, "부분": 1, "단독": 2 };
const TLABEL = { "동반": "시장 동반", "부분": "부분 동반", "단독": "단독 하락" };
const typeOf = (b) => b == null ? null : b >= 25 ? "동반" : b >= 10 ? "부분" : "단독";
const clean = (x) => x.grade !== "주의" && !(x.flags && x.flags.length);
// 매수 후보: 시장 동반 하락 + 양호/보통 + 위험표시 없음 / 관찰: 부분 동반 + 양호
const pickScore = (x) => x.type === "동반" && clean(x) ? (x.grade === "양호" ? 1000 : 0) + Math.min(x.tv20 || 0, 500) + (20 - x.rsi) : null;
const isWatch = (x) => x.type === "부분" && x.grade === "양호" && clean(x);
const josa = (w, a, b) => { const c = (w || "").trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? ((c - 0xAC00) % 28 ? a : b) : a + "(" + b + ")"; };
const isLarge = (x) => x.lg && clean(x);
const rankOf = (x) => pickScore(x) != null ? 0 : isLarge(x) ? 1 : isWatch(x) ? 2 : 3;
const TRACK_DAYS = 60;
let today = null, tracking = [], gradeF = "ALL", mkt = "ALL", st = "ALL", showN = 12, typeF = "ALL", sigT = "ALL";

async function getJSON(p) { const r = await fetch((US ? p.replace("data/", "data/us/") : p) + "?t=" + Date.now()); if (!r.ok) throw 0; return r.json(); }

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
function retChart(values, { w = 600, h = 200, compact = false } = {}) {
  const pts = values.map((v, i) => [i + 1, v]).filter((p) => p[1] != null);
  if (!pts.length) return `<div class="hint" style="padding:24px 0;text-align:center">아직 쌓인 기록이 없어요</div>`;
  const pad = compact ? [8, 30, 20, 38] : [12, 30, 24, 42];
  const xs = Math.max(values.length, 2), ys = pts.map((p) => p[1]);
  let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys); const sp = hi - lo || 1; lo -= sp * .12; hi += sp * .12;
  const [pt, pr, pb, pl] = pad;
  const X = (i) => pl + ((i - 1) / (xs - 1)) * (w - pl - pr), Y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (h - pt - pb);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = pts[pts.length - 1], col = last[1] < 0 ? "var(--down)" : "var(--up)";
  let g = ""; const step = niceStep((hi - lo) / (compact ? 3 : 4));
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step)
    g += `<line x1="${pl}" x2="${w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${Math.round(v * 10) / 10}%</text>`;
  (w < 420 ? [1, 20, 40, 60] : [1, 5, 10, 20, 40, 60]).filter((t) => t <= xs).forEach((t) =>
    g += `<text x="${X(t)}" y="${h - 5}" font-size="11" text-anchor="middle" fill="var(--muted)">D+${t}</text>`);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:100%" role="img" aria-label="신호 이후 수익률 추이">
    ${g}<line x1="${pl}" x2="${w - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".7"/>
    <path d="${d}L${X(last[0])},${Y(0)}L${X(pts[0][0])},${Y(0)}Z" fill="${col}" opacity=".1"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${col}"/></svg>`;
}
function priceChart(s, low, w) {
  const h = 120, pad = [14, 6, 16, 6];
  const lo = Math.min(...s), hi = Math.max(...s), sp = hi - lo || 1;
  const X = (i) => pad[3] + (i / (s.length - 1)) * (w - pad[1] - pad[3]);
  const Y = (v) => pad[0] + (1 - (v - lo) / sp) * (h - pad[0] - pad[2]);
  const d = s.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const hiI = s.indexOf(hi);
  const band = low.length ? `<rect x="${X(low[0]) - 3}" y="${pad[0]}" width="${X(low[low.length - 1]) - X(low[0]) + 6}" height="${h - pad[0] - pad[2]}" fill="var(--mark)" opacity=".08" rx="3"/>` : "";
  const dots = low.map((i) => `<circle cx="${X(i)}" cy="${Y(s[i])}" r="3" fill="var(--mark)"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:100%" role="img" aria-label="최근 90거래일 주가">
    ${band}<path d="${d}L${X(s.length - 1)},${h - pad[2]}L${X(0)},${h - pad[2]}Z" fill="var(--ink2)" opacity=".06"/>
    <path d="${d}" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linejoin="round"/>${dots}
    <text x="${Math.min(Math.max(X(hiI), 34), w - 34)}" y="${pad[0] - 4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">고점 ${fmt(hi)}</text>
    <text x="${pad[3]}" y="${h - 3}" font-size="10" fill="var(--muted)">90거래일 전</text>
    <text x="${w - pad[1]}" y="${h - 3}" font-size="10" text-anchor="end" fill="var(--muted)">최근</text></svg>`;
}
function breadthChart(hist, w, panic, partial) {
  if (!hist || !hist.length) return `<div class="hint" style="padding:24px 0;text-align:center">아직 데이터가 없어요</div>`;
  const h = 150, pad = [10, 34, 20, 30];
  const v = hist.map((x) => x[1]), hi = Math.max(panic + 10, ...v);
  const X = (i) => pad[3] + (i / Math.max(1, v.length - 1)) * (w - pad[1] - pad[3]);
  const Y = (x) => pad[0] + (1 - x / hi) * (h - pad[0] - pad[2]);
  const d = v.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join("");
  const last = v[v.length - 1], col = last >= panic ? "var(--good)" : last >= partial ? "var(--mid)" : "var(--muted)";
  const md = (s) => `${s.slice(4, 6)}/${s.slice(6)}`;
  const dots = v.map((x, i) => x >= panic ? `<circle cx="${X(i)}" cy="${Y(x)}" r="2.5" fill="var(--good)"/>` : "").join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:100%" role="img" aria-label="시장 과매도 비율 추이">
    <rect x="${pad[3]}" y="${Y(hi)}" width="${w - pad[1] - pad[3]}" height="${Y(panic) - Y(hi)}" fill="var(--good)" opacity=".07"/>
    <line x1="${pad[3]}" x2="${w - pad[1]}" y1="${Y(panic)}" y2="${Y(panic)}" stroke="var(--good)" stroke-dasharray="4 3"/>
    <line x1="${pad[3]}" x2="${w - pad[1]}" y1="${Y(partial)}" y2="${Y(partial)}" stroke="var(--grid)"/>
    <line x1="${pad[3]}" x2="${w - pad[1]}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--grid)"/>
    <text x="${w - pad[1] + 4}" y="${Y(panic) + 4}" font-size="10" fill="var(--good)" font-family="var(--mono)">${panic}%</text>
    <text x="${w - pad[1] + 4}" y="${Y(partial) + 4}" font-size="10" fill="var(--muted)" font-family="var(--mono)">${partial}%</text>
    <path d="${d}" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linejoin="round"/>${dots}
    <circle cx="${X(v.length - 1)}" cy="${Y(last)}" r="4" fill="${col}"/>
    <text x="${pad[3]}" y="${h - 4}" font-size="10" fill="var(--muted)">${md(hist[0][0])}</text>
    <text x="${w - pad[1]}" y="${h - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${md(hist[hist.length - 1][0])}</text></svg>`;
}
function sparkRet(path) {
  const v = path, w = 100, h = 30, lo = Math.min(0, ...v), hi = Math.max(0, ...v), sp = hi - lo || 1;
  const X = (i) => 2 + i / (v.length - 1) * (w - 4), Y = (x) => 3 + (1 - (x - lo) / sp) * (h - 6);
  const col = v[v.length - 1] < 0 ? "var(--down)" : "var(--up)";
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:100%" aria-hidden="true">
    <line x1="2" x2="${w - 2}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="2 2" opacity=".5"/>
    <path d="${v.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join("")}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

function avgAt(list, k) {
  const r = list.filter((s) => s.p.length >= k).map((s) => s.p[k - 1]);
  return r.length ? { avg: r.reduce((a, b) => a + b, 0) / r.length, win: r.filter((v) => v > 0).length / r.length * 100, n: r.length } : null;
}
function avgPath(list) { return Array.from({ length: TRACK_DAYS }, (_, k) => { const a = avgAt(list, k + 1); return a ? a.avg : null; }); }

             : `<div class="stat"><div class="v num">–</div><div class="k">${k}일 뒤 평균</div><div class="s">기록 쌓이는 중</div></div>`;
  }).join("");

      <div>${n > 1 ? sparkRet(s.p) : ""}</div>
      <div class="ret num ${last != null ? cls(last) : ""}">${last != null ? pct(last) : "–"}<small>${n ? (n >= TRACK_DAYS ? "60일 완료" : `${n}일째`) : "내일부터"}</small></div>
    </button><div class="detail" hidden></div></div>`;
  }).join("") + (list.length > showN ? `<button class="more" id="more">${list.length - showN}건 더 보기</button>` : "");
  $("sigList").querySelectorAll(".sig > button").forEach((b) => b.addEventListener("click", () => {
    const el = b.parentElement, s = shown[+el.dataset.i], det = el.querySelector(".detail");
    det.hidden = !det.hidden; b.setAttribute("aria-expanded", String(!det.hidden));
    if (!det.hidden && !det.innerHTML) {
      const n = s.p.length, at = (k) => n >= k ? `<b class="num ${cls(s.p[k - 1])}">${pct(s.p[k - 1])}</b>` : `<b>–</b>`;
      det.innerHTML = retChart(Array.from({ length: Math.max(n, 5) }, (_, k) => k < n ? s.p[k] : null), { w: Math.max(260, det.clientWidth || 560), h: 170 }) +

        `<a class="out" href="${link0(s.code)}" target="_blank" rel="noopener">${US ? "Yahoo Finance" : "네이버 증권"}에서 보기 →</a>`;
    }
  }));

function seg(id, key, cb) {
  $(id).querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    $(id).querySelectorAll("button").forEach((t) => t.classList.toggle("on", t === b)); cb(b.dataset[key]);
  }));
}
seg("gradeSeg", "g", (v) => { gradeF = v; renderCards(); });
seg("mktSeg", "m", (v) => { mkt = v; renderCards(); });
seg("stSeg", "s", (v) => { st = v; showN = 12; renderTrack(); });
seg("typeSeg", "t", (v) => { typeF = v; renderCards(); });
seg("sigTypeSeg", "t", (v) => { sigT = v; showN = 12; renderTrack(); });
$("date").addEventListener("change", (e) => loadDate(e.target.value));
if (US) $("mktSeg").hidden = true;
document.querySelectorAll("#mkSw button").forEach((b) => { b.classList.toggle("on", b.dataset.k === MK); b.onclick = () => { location.href = b.dataset.k === "congress" ? "congress.html" : b.dataset.k === "us" ? "./?m=us" : "./"; }; });
let rz, lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(() => { renderHero(); renderCards(); renderTrack(); }, 200); });

async function loadDate(d) {
  try { today = await getJSON(`data/${d}.json`); } catch { today = null; }
  renderGuide(); renderHero(); renderCards();
  $("foot").innerHTML = today ? `업데이트 ${today.generated} KST${today.failed ? ` · 조회 실패 ${today.failed}종목 제외` : ""}<br>RSI(${today.period})는 Wilder 방식. 과거 성과는 ${today.bt ? today.bt.from.slice(0, 4) + "~" + today.bt.to.slice(0, 4) + "년 " : ""}백테스트(다음 날 시가 매수, 비용 0.3% 차감, 현재 상장 종목 기준)이고, 미래 수익을 보장하지 않아요.` : "";
}
(async () => {
  try { tracking = await getJSON("data/signals.json"); } catch {}
  renderTrack();
  let idx = [];
  try { idx = await getJSON("data/index.json"); } catch {}
  if (!idx.length) { renderGuide(); renderHero(); $("headline").textContent = "첫 실행 후 여기에 결과가 나와요"; return; }
  $("date").innerHTML = idx.map((e) => `<option value="${e.date}">${e.date} · ${e.count}종목</option>`).join("");
  loadDate(idx[0].date);
})();
</script>
</body>
</html>
